# Local Postgres for development: npm run db:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goods
      POSTGRES_PASSWORD: goods
      POSTGRES_DB: goods
    ports:
      - "5432:5432"
    volumes:
      - goods-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goods"]
      interval: 2s
      retries: 20
volumes:
  goods-pg:
