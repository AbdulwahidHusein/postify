name: Deploy

# Builds the image with Cloud Build, runs migrations as a Cloud Run Job, then
# rolls out goods-jobs and goods. Auth is keyless (Workload Identity Federation).
#
# Repository configuration:
#   vars.GCP_PROJECT_ID, vars.GCP_REGION
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/github/providers/github
#   vars.GCP_DEPLOY_SERVICE_ACCOUNT      goods-deployer@<project>.iam.gserviceaccount.com
#   secrets.ENV_PROD_YAML                contents of infra/env.prod.yaml

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Write runtime config
        run: printf '%s' "$ENV_PROD_YAML" > infra/env.prod.yaml
        env:
          ENV_PROD_YAML: ${{ secrets.ENV_PROD_YAML }}
      - name: Build, migrate, deploy
        run: ./infra/deploy.sh "${GITHUB_SHA::7}"
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
