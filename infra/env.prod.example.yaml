# Non-secret runtime configuration for both Cloud Run services.
# Copy to infra/env.prod.yaml (git-ignored) and edit. Secrets live in Secret Manager.
NEXT_PUBLIC_APP_URL: "https://goods.et"
ROOT_DOMAIN: "goods.et"
COOKIE_DOMAIN: ".goods.et"
DATABASE_POOL_MAX: "5"

TELEGRAM_BOT_USERNAME: "goods_et_bot"
TELEGRAM_MINI_APP_SHORT_NAME: "shop"
OPS_TELEGRAM_CHAT_ID: ""            # your Telegram user id: ops alerts (AI budget, webhook health)

# AI: Vertex AI via the runtime service account (no API key needed)
GOOGLE_CLOUD_PROJECT: "my-project"
GOOGLE_CLOUD_LOCATION: "europe-west1"
LLM_MODEL: "gemini-2.5-flash"
AI_DAILY_BUDGET_USD: "3"
AI_SHOP_DAILY_QUOTA: "100"
AI_NEW_SHOP_DAILY_QUOTA: "20"

# Background jobs (TASKS_TARGET_URL / TASKS_AUDIENCE are filled in by deploy.sh)
TASKS_MODE: "cloud"
TASKS_PROJECT: "my-project"
TASKS_LOCATION: "europe-west1"
TASKS_SERVICE_ACCOUNT: "goods-invoker@my-project.iam.gserviceaccount.com"

# Cloudflare R2 (S3 API)
S3_ENDPOINT: "https://<account-id>.r2.cloudflarestorage.com"
S3_BUCKET: "goods-public"
S3_PRIVATE_BUCKET: "goods-private"
MEDIA_PUBLIC_URL: "https://img.goods.et"
CLOUDFLARE_ZONE_ID: ""
